name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: make check (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Debian 13 (Python 3.13): the confirmed Optiplex release.
        # Tests run on the distro Python, never a downloaded one.
        image: ["debian:trixie"]
    container: ${{ matrix.image }}
    env:
      UV_PYTHON_DOWNLOADS: never
      UV_VERSION: "0.11.32"
    steps:
      - name: Install build prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build make git ca-certificates python3 python3-venv
      - uses: actions/checkout@v4
      - name: Install pinned uv
        run: |
          python3 -m venv /opt/uv
          /opt/uv/bin/pip install --no-cache-dir "uv==${UV_VERSION}"
          echo /opt/uv/bin >> "$GITHUB_PATH"
      - name: Record toolchain
        run: |
          . /etc/os-release && echo "$PRETTY_NAME"
          python3 --version; cc --version | head -1; c++ --version | head -1; cmake --version | head -1; uv --version
      - run: make sync
      - run: make check
      - name: Worker tests under AddressSanitizer + UBSan
        run: make test-worker-san
