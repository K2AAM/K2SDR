name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: make check (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Debian 13 (Python 3.13): the confirmed Optiplex release.
        # Tests run on the distro Python, never a downloaded one.
        image: ["debian:trixie"]
    container: ${{ matrix.image }}
    env:
      UV_PYTHON_DOWNLOADS: never
      K2_REQUIRE_PROBE: "1"   # the Airspy probe and its mock must build and be tested
      K2_EXPECT_FFTW_INSTALLED: "1"   # dependency check must see FFTW + Debian liquid present and still pass
      UV_VERSION: "0.11.32"
    steps:
      - name: Install build prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build make git ca-certificates python3 python3-venv \
            pkg-config libairspyhf-dev nodejs npm \
            libfftw3-dev libliquid-dev   # installed on purpose: the build must still exclude both
      - uses: actions/checkout@v4
      - name: Install pinned uv
        run: |
          python3 -m venv /opt/uv
          /opt/uv/bin/pip install --no-cache-dir "uv==${UV_VERSION}"
          echo /opt/uv/bin >> "$GITHUB_PATH"
      - name: Record toolchain
        run: |
          . /etc/os-release && echo "$PRETTY_NAME"
          python3 --version; cc --version | head -1; c++ --version | head -1; cmake --version | head -1; uv --version
          # THIRD_PARTY.md: exact runtime versions, as an annotation (readable without the raw log)
          echo "::notice title=Runtime packages::$(dpkg-query -W -f='${Package} ${Version}; ' 'libairspyhf*' 'libusb-1.0*' libudev1 libcap2 2>/dev/null)"
      - run: make sync
      - name: make probe
        run: |
          set -o pipefail
          pkg-config --modversion libairspyhf
          make probe 2>&1 | tee check.log
      - name: liquid-dsp dependency closure (FFTW and Debian liquid-dsp installed)
        run: |
          set -o pipefail
          python3 tools/check_dsp_deps.py build/worker build/third_party/liquid-dsp \
            --expect-fftw-installed --expect-debian-liquid 2>&1 | tee -a check.log
      - name: Browser UI (Debian 13's own Node, as on the Optiplex)
        run: |
          set -o pipefail
          node --version; npm --version
          (make web-test && make web) 2>&1 | tee -a check.log
          test -f web/dist/index.html
          ! grep -q "<script>" web/dist/index.html    # no inline script (strict CSP)
      - name: make check
        run: |
          set -o pipefail
          PYTEST_ADDOPTS="-rfE --tb=short" make check 2>&1 | tee -a check.log
      - name: DSP benchmark (recorded, not gated)
        run: |
          build/worker/ksdr-dsp-check bench --seconds 4 > bench.jsonl
          python3 - <<'PY'
          import json
          rows = [json.loads(x) for x in open("bench.jsonl")]
          fft = [f"n={e['n']} {e['frame_us']:.0f}us" for e in rows if e["event"] == "bench_fft" and e["rate_hz"] == 384000]
          ch = [f"{e['mode']}@{e['rate_hz']//1000}k {e['cpu_pct_per_channel']:.1f}%" for e in rows if e["event"] == "bench_chain"]
          print("::notice title=DSP bench (CI runner)::" + "; ".join(fft) + " | " + "; ".join(ch))
          PY
      - name: Report failing tests as an annotation
        if: failure()
        run: |
          python3 - <<'PY'
          import re
          log = open("check.log", encoding="utf-8", errors="replace").read().splitlines()
          start = next((i for i, l in enumerate(log) if "short test summary info" in l), None)
          lines = log[start:start + 60] if start is not None else log[-80:]
          # Last traceback lines help when the summary alone is not enough.
          tb = [l for l in log if re.match(r"^E\s", l)][-30:]
          # Compiler/linker errors first: long command lines would otherwise push them out.
          cc = [l[:400] for l in log if re.search(r"(error:|undefined reference|FAILED:)", l)][:40]
          lines = [l[:400] for l in lines]
          msg = "\n".join(["--- build errors ---"] + cc + ["--- log ---"] + lines + ["--- assertion lines ---"] + tb)
          msg = msg.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print(f"::error title=make check failed::{msg[:60000]}")
          PY
      - name: Tests pinned to one CPU core (exposes concurrency races)
        run: taskset -c 0 make test
      - name: Worker tests under AddressSanitizer + UBSan
        run: make test-worker-san
